<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="5;url=https://studio.creekers-lab.com/" />
  <title>サイト移転のお知らせ | Creekers Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080e0d;
      color: #edf5f3;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      text-align: center;
      padding: 2rem;
    }
    .label {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #2e8a78;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 300;
      line-height: 1.8;
      color: #edf5f3;
      margin-bottom: 2.5rem;
    }
    .btn {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #52c7af;
      text-decoration: none;
      border: 1px solid rgba(82,199,175,0.4);
      padding: 0.9rem 2rem;
      transition: border-color 0.25s, color 0.25s;
    }
    .btn:hover {
      color: #edf5f3;
      border-color: #52c7af;
    }
    .note {
      margin-top: 2rem;
      font-size: 0.72rem;
      color: #7a9e98;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="label">Creekers Lab</p>
    <h1>
      サイトを移転しました。<br>
      5秒後に新しいページへ移動します。
    </h1>
    <a class="btn" href="https://studio.creekers-lab.com/">新しいサイトへ →</a>
    <p class="note">自動で移動しない場合は上のリンクをクリックしてください。</p>
  </div>
</body>
</html>
